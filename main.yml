name: Build S2B Hayagriva APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Download Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle project
        run: |
          echo "=== PROJECT ==="
          find . -maxdepth 3 -type f | sort
          echo "=== GRADLE PROJECTS ==="
          gradle --version
          gradle projects

      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload S2B Hayagriva APK
        uses: actions/upload-artifact@v4
        with:
          name: S2B-Hayagriva-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
